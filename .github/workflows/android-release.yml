name: Android Release APK

# Builds the signed release APK and attaches it to a GitHub Release so the
# self-hosted F-Droid repo (deranjer/fdroid) can pick it up.
#
# Runs automatically after every Release workflow completes — it (re)checks the
# latest v* release and backfills a signed APK if one isn't already attached.
# Releases created with GITHUB_TOKEN don't emit a `release` event, so we hang
# off `workflow_run` instead. Can also be dispatched manually to (re)build a
# specific tag.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to (blank = latest v*)
        required: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve target release
    # On workflow_run, only proceed when the Release run actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Resolve target release tag
        id: tag
        run: |
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft \
              -q '[.[] | select(.isDraft | not) | .tagName | select(startswith("v"))][0]')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No v* release found to attach an APK to" && exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target release: $TAG"

      - name: Skip if an APK is already attached
        id: gate
        run: |
          COUNT=$(gh release view "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '[.assets[].name | select(endswith(".apk"))] | length')
          # Manual dispatch always (re)builds; auto runs skip if already present.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$COUNT" -gt 0 ]; then
            echo "APK already attached to ${{ steps.tag.outputs.tag }} — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive versionName / versionCode from tag
        id: ver
        run: |
          V="${{ steps.tag.outputs.tag }}"
          V="${V#v}"                 # strip leading v
          IFS=. read -r MA MI PA <<< "$V"
          PA=${PA%%-*}               # drop any prerelease suffix (e.g. 1.2.0-beta.1)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"

  build:
    name: Build & attach signed APK
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.resolve.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release APK
        working-directory: apps/android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionName="$VERSION" \
            -PversionCode="${{ needs.resolve.outputs.version_code }}"

      - name: Attach APK to release
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk \
             "domitara-$VERSION.apk"
          gh release upload "${{ needs.resolve.outputs.tag }}" "domitara-$VERSION.apk" --clobber
