name: Android Checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android — Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 9.1 requires JDK 17+ to run the build.
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Derive dev version
        # Debug builds don't go through android-release.yml's tag-based
        # versioning, so every CI build otherwise looks like the same
        # hardcoded "1.0.0" default. Stamp the latest release tag plus the
        # run number and commit so a sideloaded debug build is identifiable.
        id: ver
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "name=${LAST_TAG#v}-dev.${{ github.run_number }}+$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Lint, test, assemble
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
