name: Expo Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/panel-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/panel-core/**'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: EAS Build (${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.ref == 'refs/heads/main' && 'preview' || 'development') }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        working-directory: apps/mobile
        run: |
          PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.ref == 'refs/heads/main' && 'preview' || 'development') }}"
          eas build --profile "$PROFILE" --platform all --non-interactive
