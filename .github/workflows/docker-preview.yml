name: Docker Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-preview:
    name: Build & Push Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

  delete-preview:
    name: Delete Preview Image
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    permissions:
      packages: write
    steps:
      - name: Delete PR preview image
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `pr-${{ github.event.pull_request.number }}`;
            const pkgName = context.repo.repo;
            const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
              package_type: 'container',
              package_name: pkgName,
              org: context.repo.owner,
            }).catch(() =>
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                package_type: 'container',
                package_name: pkgName,
                username: context.repo.owner,
              })
            );
            const match = versions.data.find(v => v.metadata?.container?.tags?.includes(tag));
            if (match) {
              await github.rest.packages.deletePackageVersionForOrg({
                package_type: 'container',
                package_name: pkgName,
                org: context.repo.owner,
                package_version_id: match.id,
              }).catch(() =>
                github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container',
                  package_name: pkgName,
                  username: context.repo.owner,
                  package_version_id: match.id,
                })
              );
              console.log(`Deleted image tagged ${tag}`);
            } else {
              console.log(`No image found for tag ${tag}`);
            }
